name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONNOUSERSITE: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-deps -e .
      - name: Verify the test profile excludes model runtimes
        run: |
          python - <<'PY'
          from importlib.util import find_spec
          for package in ("torch", "transformers", "sentence_transformers", "accelerate"):
              assert find_spec(package) is None, f"Unexpected model runtime in CPU CI: {package}"
          PY
      - run: python -m ruff format --check src scripts tests
      - run: python -m ruff check src scripts tests
      - run: python -m mypy src scripts
      - run: python -m pytest --cov=choiceagent --cov-fail-under=80 --cov-report=xml
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: coverage.xml
